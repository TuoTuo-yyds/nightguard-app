<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050a11">
<title>夜安 NightGuard · APP 界面设计</title>
<link rel="stylesheet" href="leaflet.css?v=bb5de63e">
<script src="leaflet.js?v=bb5de63e"></script>
<style>

:root{
  --ink:#050a11; --panel:#0b121b; --line:rgba(255,255,255,.09);
  --cyan:#25e5cd; --red:#ff2d3f; --orange:#ff8a1f;
  --txt:#e9f3f8; --muted:#7c8da0; --dim:#4e5f73;
  --mapveil:radial-gradient(circle at 50% 40%,transparent 26%,rgba(3,7,12,.55) 100%),linear-gradient(180deg,rgba(3,7,12,.92) 0%,transparent 20%,transparent 60%,rgba(3,7,12,.96) 100%);
  --legend-bg:rgba(6,14,20,.68); --legend-txt:#b6c6d4; --legend-line:rgba(255,255,255,.08);
  --pill-bg:rgba(6,14,20,.78);
}
body.day{
  --ink:#eef3f7; --panel:#ffffff; --line:rgba(0,0,0,.1);
  --cyan:#0fae99; --red:#e02338; --orange:#e8790f;
  --txt:#16232e; --muted:#647589; --dim:#93a2b1;
  --mapveil:radial-gradient(circle at 50% 40%,transparent 26%,rgba(255,255,255,.4) 100%),linear-gradient(180deg,rgba(240,245,249,.92) 0%,transparent 20%,transparent 60%,rgba(240,245,249,.96) 100%);
  --legend-bg:rgba(255,255,255,.85); --legend-txt:#33475a; --legend-line:rgba(0,0,0,.1);
  --pill-bg:rgba(255,255,255,.85);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--txt);line-height:1.6;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;overflow-x:hidden}
::selection{background:var(--cyan);color:#04211d}
svg{display:block}
button{font-family:inherit}

/* 顶部导航 */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:13px 5vw;background:rgba(5,10,17,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar .brand-mini{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:2px;font-size:15px}
.topbar .brand-mini svg{width:26px;height:26px}
.topbar .pill{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:5px 13px;border-radius:99px;letter-spacing:.6px}

/* 介绍区 */
.intro{padding:104px 5vw 46px;border-bottom:1px solid var(--line);background:radial-gradient(900px 430px at 78% 8%,rgba(37,229,205,.1),transparent 65%),radial-gradient(700px 400px at 8% 92%,rgba(108,123,255,.09),transparent 62%),var(--ink)}
.intro-inner{max-width:1180px;margin:0 auto;display:flex;gap:40px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:4px;font-weight:700}
.intro h1{font-size:clamp(32px,5vw,52px);font-weight:800;letter-spacing:4px;margin-top:10px;line-height:1.15}
.intro h1 span{font-size:.52em;color:var(--muted);letter-spacing:3px;font-weight:600;margin-left:10px}
.intro p{color:var(--muted);font-size:14px;max-width:650px;margin-top:14px;line-height:1.9}
.page-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.page-chips button{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-size:12px;padding:8px 15px;border-radius:99px;cursor:pointer;transition:.2s}
.page-chips button:hover{color:var(--txt);border-color:rgba(37,229,205,.4)}
.page-chips button.on{background:rgba(37,229,205,.14);border-color:rgba(37,229,205,.5);color:var(--cyan);font-weight:700}
.intro-meta{text-align:right;color:var(--dim);font-size:11.5px;letter-spacing:1px;line-height:1.9}
.intro-meta b{display:block;font-size:32px;color:var(--cyan);letter-spacing:0;line-height:1.2}

/* 展示区 */
.showcase{padding:46px 5vw 84px}
.showcase-inner{max-width:1180px;margin:0 auto;display:flex;gap:56px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.guide{width:330px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;padding-top:8px}
.guide-head{font-size:12px;letter-spacing:3px;color:var(--muted);font-weight:700}
.screen-list{display:flex;flex-direction:column;gap:10px}
.screen-item{display:flex;gap:13px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:13px 15px;cursor:pointer;color:var(--txt);transition:.22s}
.screen-item:hover{border-color:rgba(37,229,205,.35);transform:translateX(3px)}
.screen-item.on{border-color:rgba(37,229,205,.55);background:linear-gradient(135deg,rgba(37,229,205,.13),var(--panel))}
.screen-item .num{font-size:19px;font-weight:800;color:transparent;-webkit-text-stroke:1px var(--dim);flex-shrink:0;width:28px}
.screen-item.on .num{-webkit-text-stroke:1px var(--cyan);color:var(--cyan)}
.screen-item b{display:block;font-size:14px;letter-spacing:.5px}
.screen-item small{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.5}
.tip-card{border:1px dashed rgba(37,229,205,.28);border-radius:15px;padding:15px 17px;background:rgba(37,229,205,.04)}
.tip-card h5{font-size:12px;color:var(--cyan);letter-spacing:2px;margin-bottom:8px}
.tip-card p{font-size:11.5px;color:var(--muted);line-height:1.95}
.tip-card p b{color:#ff8a95}

/* 原型区 */
.phone-holder{position:relative;flex-shrink:0;width:420px;height:892px}
.phone{width:420px;height:892px;border-radius:60px;background:#000;box-sizing:border-box;border:9px solid #0b1017;position:relative;box-shadow:0 0 0 1.5px #2b3a4f,0 0 0 11px #05080d,0 50px 110px rgba(0,0,0,.8)}
.screen{position:absolute;inset:0;border-radius:51px;overflow:hidden;background:var(--ink);isolation:isolate}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:124px;height:35px;background:#000;border-radius:20px;z-index:95;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06)}
.island::after{content:"";position:absolute;right:14px;top:11px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1b2a3a,#02060a 70%)}

/* 状态栏 */
.statusbar{height:58px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-size:14px;font-weight:600;letter-spacing:.4px;flex-shrink:0;color:var(--txt);position:relative;z-index:30}
.statusbar .sb-r{display:flex;align-items:center;gap:5px}
.statusbar .sb-r svg{height:11px;width:auto}
.bat{width:25px;height:12px;border:1.2px solid rgba(255,255,255,.55);border-radius:4px;padding:1.6px}
.bat i{display:block;height:100%;width:82%;background:var(--txt);border-radius:1.5px}
.statusbar.abs{position:absolute;top:0;left:0;right:0;background:linear-gradient(180deg,var(--sbgrad),transparent)}
:root{--sbgrad:rgba(3,8,13,.9)} body.day{--sbgrad:rgba(240,245,249,.9)}

/* 页面 */
@keyframes fade{from{opacity:0}to{opacity:1}}
.page{position:absolute;inset:0;display:none;flex-direction:column;background:var(--ink)}
.page.active{display:flex}

/* 底部导航 */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;z-index:50;display:flex;align-items:flex-start;padding-top:9px;background:rgba(6,11,17,.94);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.06)}
.tab{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:#5e7285;font-size:10.5px;padding:0;transition:.2s}
.tab svg{width:23px;height:23px;transition:.2s}
.tab.on{color:var(--cyan)}
.tab.on svg{filter:drop-shadow(0 0 7px rgba(37,229,205,.65))}
.home-bar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:99px;background:rgba(255,255,255,.55);z-index:60;pointer-events:none}

/* 通用控件 */
.hbtn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.11);background:rgba(10,18,26,.55);backdrop-filter:blur(9px);color:#dfeaf2;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.hbtn svg{width:20px;height:20px}
.hbtn:active{transform:scale(.92)}
.hbtn.on{color:var(--cyan);border-color:rgba(37,229,205,.55);background:rgba(37,229,205,.13)}

/* 首页 */
#p-home{position:absolute;inset:0;display:none}
#p-home.active{display:block}
.map-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#realmap{position:absolute;left:-25%;top:-25%;width:150%;height:150%;z-index:2;opacity:0;transition:opacity .5s;transform-origin:50% 50%;background:#060e16}
#realmap.ready{opacity:1}
#realmap .leaflet-container{background:#060e16}
#realmap .ng-me-wrap{background:transparent;border:none}
#realmap .ng-me-arrow{width:40px;height:40px;transform-origin:50% 50%;filter:drop-shadow(0 0 8px rgba(37,229,205,.9))}
#realmap .ng-radar-sweep{position:absolute;pointer-events:none;border-radius:50%;background:conic-gradient(from 0deg,rgba(37,229,205,.42),rgba(37,229,205,.08) 50deg,transparent 95deg);animation:ngsweep 3.2s linear infinite;-webkit-mask:radial-gradient(circle,transparent 6%,#000 7%);mask:radial-gradient(circle,transparent 6%,#000 7%)}
@keyframes ngsweep{to{transform:rotate(360deg)}}
.map-veil{position:absolute;inset:0;pointer-events:none;z-index:3;background:var(--mapveil)}
.map-glow{filter:drop-shadow(0 0 6px rgba(37,229,205,.8))}
.lamp-glow{filter:drop-shadow(0 0 7px rgba(255,178,80,.9))}
.cam-glow{filter:drop-shadow(0 0 5px rgba(120,210,255,.6))}
/* 导航搜索栏 */
.nav-search{position:absolute;top:62px;left:16px;right:16px;height:46px;z-index:31;display:flex;align-items:center;gap:6px;padding:0 8px 0 6px;border-radius:15px;background:rgba(7,14,21,.88);border:1px solid rgba(37,229,205,.4);box-shadow:0 0 18px rgba(37,229,205,.12),inset 0 0 12px rgba(37,229,205,.05);backdrop-filter:blur(12px)}
.nav-search .ns-btn{width:34px;height:34px;flex-shrink:0;border:none;background:none;color:var(--cyan);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px;transition:.2s}
.nav-search .ns-btn:active{background:rgba(37,229,205,.15)}
.nav-search .ns-btn svg{width:21px;height:21px}
.nav-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--txt);font-size:13px;font-family:inherit;caret-color:var(--cyan)}
.nav-search input::placeholder{color:#7c8fa1}

/* 路线规划面板 */
.route-panel{position:absolute;left:0;right:0;bottom:0;z-index:45;background:linear-gradient(180deg,rgba(7,13,20,.97),#050a10);border-top:1px solid rgba(37,229,205,.35);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.4,0,.2,1);padding:0 16px 92px;max-height:66%;overflow-y:auto;scrollbar-width:none}
.route-panel::-webkit-scrollbar{display:none}
.route-panel.open{transform:none}
.route-panel .rp-head{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 10px;position:sticky;top:0;background:linear-gradient(180deg,#070d14 75%,transparent);z-index:2}
.route-panel .rp-head h4{font-size:16px;font-weight:700;letter-spacing:.5px}
.route-panel .rp-head .rp-close{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.05);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.route-panel .rp-head .rp-close svg{width:15px;height:15px}
.route-panel .rp-dest{font-size:11px;color:#8ba0b2;margin-bottom:12px}
.route-card{border:1px solid var(--line);border-radius:18px;padding:14px 15px;margin-bottom:12px;background:linear-gradient(150deg,#101923,#0a1017);cursor:pointer;transition:.22s;position:relative;overflow:hidden}
.route-card:active{transform:scale(.99)}
.route-card.sel{border-color:rgba(37,229,205,.65);box-shadow:0 0 20px rgba(37,229,205,.15)}
.route-card .rc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.route-tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;letter-spacing:.5px}
.route-tag.fast{background:rgba(255,138,31,.15);color:#ffb057;border:1px solid rgba(255,138,31,.4)}
.route-tag.safe{background:rgba(37,229,205,.14);color:var(--cyan);border:1px solid rgba(37,229,205,.45)}
.route-grade{font-size:10.5px;padding:3px 9px;border-radius:99px;font-weight:700}
.route-grade.high{background:rgba(37,229,205,.12);color:#5ff0dd}
.route-grade.mid{background:rgba(255,193,7,.13);color:#ffd166}
.route-card .rc-main{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.route-card .rc-time{font-size:25px;font-weight:800;color:#fff}
.route-card .rc-time small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.route-card .rc-dist{font-size:11.5px;color:#8ba0b2}
.route-card .rc-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:#93a7b8}
.route-card .rc-stats span{display:flex;align-items:center;gap:4px}
.route-card .rc-stats i{width:7px;height:7px;border-radius:50%;display:inline-block}
.route-card .rc-note{font-size:10.5px;color:#8497a9;line-height:1.6;margin-top:9px}
.route-card .rc-note.warn{color:#ffb057}
.route-card .rc-note.good{color:#5ff0dd}
.route-go{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;color:var(--cyan);border:1px solid rgba(37,229,205,.45);border-radius:99px;padding:5px 14px}

/* 地点搜索结果 */
.place-panel{position:absolute;top:114px;left:16px;right:16px;z-index:32;max-height:430px;overflow-y:auto;background:rgba(7,13,20,.97);border:1px solid rgba(37,229,205,.35);border-radius:18px;box-shadow:0 18px 44px rgba(0,0,0,.6);backdrop-filter:blur(14px);display:none;scrollbar-width:none}
.place-panel::-webkit-scrollbar{display:none}
.place-panel.open{display:block;animation:fade .2s}
.place-panel .pp-head{padding:11px 15px 8px;font-size:10.5px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.07)}
.place-item{display:flex;align-items:flex-start;gap:10px;padding:12px 15px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:.15s}
.place-item:last-child{border-bottom:none}
.place-item:active{background:rgba(37,229,205,.09)}
.place-item .pi-ico{width:30px;height:30px;border-radius:9px;background:rgba(37,229,205,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--cyan)}
.place-item .pi-ico svg{width:16px;height:16px}
.place-item .pi-body{min-width:0;flex:1}
.place-item b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place-item small{display:block;font-size:10.5px;color:#8497a9;line-height:1.5;margin-top:2px}
.place-empty{padding:26px 15px;text-align:center;color:#6f8296;font-size:12px;line-height:1.7}
.route-loading{padding:30px 15px;text-align:center;color:var(--cyan);font-size:12.5px}
.route-loading .spin{width:26px;height:26px;border:2px solid rgba(37,229,205,.2);border-top-color:var(--cyan);border-radius:50%;margin:0 auto 12px;animation:rot .8s linear infinite}
.home-top{position:absolute;top:118px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;z-index:30}
.radar{position:absolute;width:286px;height:286px;left:50%;top:214px;transform:translateX(-50%);border-radius:50%;border:1px solid rgba(37,229,205,.45);z-index:12;pointer-events:none;background:radial-gradient(circle,rgba(37,229,205,.07) 0%,rgba(37,229,205,.02) 55%,transparent 72%);box-shadow:0 0 44px rgba(37,229,205,.18),inset 0 0 60px rgba(37,229,205,.07)}
.radar::before{content:"";position:absolute;inset:17%;border-radius:50%;border:1px solid rgba(37,229,205,.22)}
.radar::after{content:"";position:absolute;inset:34%;border-radius:50%;border:1px solid rgba(37,229,205,.16)}
.radar .cross{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.radar .cross i{position:absolute;background:linear-gradient(90deg,transparent,rgba(37,229,205,.22),transparent)}
.radar .cross i:nth-child(1){left:0;right:0;top:50%;height:1px}
.radar .cross i:nth-child(2){top:0;bottom:0;left:50%;width:1px}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(37,229,205,.34),rgba(37,229,205,.06) 60deg,transparent 95deg);animation:rot 4.2s linear infinite;-webkit-mask:radial-gradient(circle,transparent 8%,#000 9%);mask:radial-gradient(circle,transparent 8%,#000 9%)}
@keyframes rot{to{transform:rotate(360deg)}}
.radar .nav-arrow{position:absolute;left:50%;top:50%;width:86px;height:86px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 14px rgba(37,229,205,.85));animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.05)}}
.radar .blip{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.radar .blip.b1{left:25%;top:31%}
.radar .blip.b2{left:73%;top:42%}
.radar .blip.b3{left:38%;top:68%}
.radar .pulse{position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(37,229,205,.5);animation:pulse 3s ease-out infinite}
@keyframes pulse{0%{transform:scale(.75);opacity:.8}100%{transform:scale(1.12);opacity:0}}
.guard-status{position:absolute;top:170px;left:0;right:0;z-index:30;display:flex;justify-content:center}
.guard-status .gs-pill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;font-size:11px;color:var(--txt);background:var(--pill-bg);border:1px solid rgba(37,229,205,.35);backdrop-filter:blur(8px);cursor:pointer;font-family:inherit;transition:.2s}
.guard-status .gs-pill.active{border-color:rgba(37,229,205,.75);background:rgba(9,32,29,.85);box-shadow:0 0 16px rgba(37,229,205,.25)}
.guard-status .gs-pill i{width:7px;height:7px;border-radius:50%;background:#3ddc97;box-shadow:0 0 9px #3ddc97;animation:blink 1.6s infinite}
.guard-status .gs-pill b{color:var(--cyan)}
.map-legend{position:absolute;top:510px;left:18px;z-index:20;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:10.5px;color:var(--legend-txt);background:var(--legend-bg);border:1px solid var(--legend-line);border-radius:14px;padding:11px 13px;backdrop-filter:blur(8px)}
.map-legend strong{font-size:10px;color:var(--muted);letter-spacing:1px;font-weight:600;margin-bottom:1px}
.map-legend span{display:flex;align-items:center;gap:7px}
.map-legend i{width:7px;height:7px;background:var(--ic,currentColor);box-shadow:0 0 var(--glow,6px) var(--ic,currentColor);display:inline-block}
.lg-lamp{--ic:#ffb44d} .lg-cam{--ic:#dce9f3} .lg-safe{--ic:#25e5cd} .lg-risk{--ic:#ff5a4d}
/* 形状 */
.shape-square{border-radius:1px!important} .shape-tri{border-radius:0!important;clip-path:polygon(50% 0,100% 100%,0 100%)} .shape-diamond{border-radius:0!important;transform:rotate(45deg)} .shape-star{border-radius:0!important;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.route-card .rc-stats i.lg-lamp,.route-card .rc-stats i.lg-cam,.route-card .rc-stats i.lg-safe,.route-card .rc-stats i.lg-risk{background:var(--ic);box-shadow:0 0 var(--glow,6px) var(--ic)}
.home-actions{position:absolute;bottom:98px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:20px;z-index:30}
.sos-big{width:132px;height:132px;border-radius:50%;border:none;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:radial-gradient(circle at 38% 28%,#ff6b73 0%,#f01a2e 45%,#b30619 100%);color:#fff;font-size:31px;font-weight:800;letter-spacing:1px;box-shadow:0 0 42px rgba(255,45,63,.6),inset 0 -8px 20px rgba(0,0,0,.35),inset 0 6px 14px rgba(255,255,255,.18);transition:transform .12s}
.sos-big .sos-sub{font-size:10px;font-weight:600;letter-spacing:3px;opacity:.85}
.sos-big::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(255,45,63,.45);animation:pulse 2s ease-out infinite}
.sos-big:active{transform:scale(.94)}

.me-tile small{color:#7d90a3;font-size:10.5px;display:block;margin-top:3px}
.me-list{margin-top:14px;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.me-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(255,255,255,.03);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);transition:.2s}
.me-row:last-child{border-bottom:none}
.me-row:active{background:rgba(37,229,205,.07)}
.me-row .ri{width:30px;height:30px;border-radius:9px;background:rgba(37,229,205,.1);display:flex;align-items:center;justify-content:center;color:var(--cyan);flex-shrink:0}
.me-row .ri svg{width:16px;height:16px}
.me-row span{flex:1;font-size:13px}
.me-row em{font-style:normal;font-size:11px;color:#6f8296}
.me-row .chev{width:15px;height:15px;color:#4e5f73}

/* 二级页 */
.subpage{position:absolute;inset:0;z-index:66;background:var(--ink);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);padding-bottom:20px}
.subpage.open{transform:none}
.sub-head{display:flex;align-items:center;gap:12px;padding:0 18px 14px;flex-shrink:0}
.sub-head h3{font-size:17px;font-weight:700;letter-spacing:.5px}
.sub-body{flex:1;overflow-y:auto;padding:0 18px 24px;scrollbar-width:none}
.sub-body::-webkit-scrollbar{display:none}
.trace-card{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.08);margin-bottom:14px;background:#08111a}
.trace-card svg{width:100%;display:block}
.sub-note{font-size:11.5px;color:#7d90a3;margin:8px 0 16px;line-height:1.7}
.sub-title-sm{font-size:12px;color:#8ba0b2;letter-spacing:2px;margin:16px 0 9px}
.c-item{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:16px;margin-bottom:9px;background:linear-gradient(160deg,#141c26,#0d131b);border:1px solid rgba(255,255,255,.07)}
.c-item .cav{width:40px;height:40px;border-radius:50%;background:rgba(37,229,205,.1);border:1px solid rgba(37,229,205,.2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.c-item b{display:block;font-size:13.5px}
.c-item small{color:#7d90a3;font-size:10.5px}
.c-item .tag{margin-left:auto;font-size:9.5px;padding:3px 8px;border-radius:99px;background:rgba(255,45,63,.13);color:#ff8a95;flex-shrink:0}
.add-line{width:100%;padding:13px;border-radius:16px;border:1px dashed rgba(255,255,255,.16);background:none;color:#8ba0b2;font-size:12.5px;cursor:pointer;transition:.2s}
.add-line:hover{border-color:rgba(37,229,205,.5);color:var(--cyan)}

/* 设置面板 */
.settings-page{position:absolute;inset:0;z-index:68;background:var(--ink);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1)}
.settings-page.open{transform:none}
.set-head{display:flex;align-items:center;gap:12px;padding:0 18px 14px;flex-shrink:0}
.set-head h3{font-size:17px;font-weight:700;letter-spacing:.5px;flex:1}
.set-scroll{flex:1;overflow-y:auto;padding:0 16px 30px;scrollbar-width:none}
.set-scroll::-webkit-scrollbar{display:none}
.set-group{margin-top:18px}
.set-group h5{font-size:11px;color:var(--cyan);letter-spacing:2px;margin-bottom:10px;font-weight:700}
.set-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:15px;background:var(--panel);border:1px solid var(--line);margin-bottom:9px}
.set-row .sr-ico{width:32px;height:32px;border-radius:9px;background:rgba(37,229,205,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--cyan)}
.set-row .sr-ico svg{width:17px;height:17px}
.set-row .sr-label{flex:1;min-width:0}
.set-row .sr-label b{display:block;font-size:13px;font-weight:600}
.set-row .sr-label small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
/* 分段选择 */
.seg-ctrl{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;padding:3px;flex-shrink:0}
.seg-ctrl button{border:none;background:none;color:var(--muted);font-size:11px;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.2s;white-space:nowrap}
.seg-ctrl button.on{background:linear-gradient(135deg,#4df3dc,#00bfa8);color:#032a26;font-weight:700;box-shadow:0 0 12px rgba(37,229,205,.35)}
/* 开关 */
.toggle{width:44px;height:25px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;cursor:pointer;transition:.25s;flex-shrink:0;border:none}
.toggle i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#e9f3f8;transition:.25s}
.toggle.on{background:var(--cyan)}
.toggle.on i{left:22px;background:#032a26}
/* 图标个性化行 */
.icon-custom{border-radius:15px;background:var(--panel);border:1px solid var(--line);padding:13px 15px;margin-bottom:9px}
.icon-custom .ic-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.icon-custom .ic-preview{width:20px;height:20px;border-radius:50%;background:var(--ic);box-shadow:0 0 var(--glow,6px) var(--ic);flex-shrink:0}
.icon-custom .ic-head b{font-size:12.5px;flex:1}
.ic-opt{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:10px;color:var(--muted)}
.ic-opt .opt-label{width:26px;flex-shrink:0}
.color-dots{display:flex;gap:7px}
.color-dot{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s}
.color-dot.on{border-color:var(--txt);transform:scale(1.15)}
.shape-opts{display:flex;gap:6px;flex:1}
.shape-opt{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.shape-opt.on{border-color:var(--cyan);background:rgba(37,229,205,.12)}
.shape-opt i{width:9px;height:9px;background:currentColor;display:block}
/* 弹层 */
.mask{position:absolute;inset:0;background:rgba(2,6,10,.62);backdrop-filter:blur(3px);z-index:70;opacity:0;pointer-events:none;transition:.25s}
.mask.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:72;max-height:74%;background:linear-gradient(180deg,#101923,#080d13);border-radius:26px 26px 0 0;border-top:1px solid rgba(255,255,255,.1);transform:translateY(105%);transition:transform .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding-bottom:28px;box-shadow:0 -20px 50px rgba(0,0,0,.6)}
.sheet.open{transform:none}
.sheet .handle{width:42px;height:4px;border-radius:99px;background:rgba(255,255,255,.2);margin:10px auto 4px;flex-shrink:0}
.sheet .sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 12px;flex-shrink:0}
.sheet .sh-head h4{font-size:16px;font-weight:700}
.sheet .sh-body{overflow-y:auto;padding:0 20px;scrollbar-width:none}
.sheet .sh-body::-webkit-scrollbar{display:none}
.s-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.s-item:last-child{border-bottom:none}
.s-item .si-ico{width:40px;height:40px;border-radius:10px;background:rgba(37,229,205,.09);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.s-item b{display:block;font-size:13px}
.s-item small{color:#7d90a3;font-size:10.5px}
.s-item .si-r{margin-left:auto;font-size:12px;color:var(--cyan);flex-shrink:0}
.s-item .si-del{margin-left:auto;color:#ff8a95;font-size:11px;background:none;border:none;cursor:pointer}

/* SOS */
.sos-overlay{position:absolute;inset:0;z-index:86;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(30,3,8,.86);backdrop-filter:blur(10px);padding:0 28px}
.sos-overlay.open{display:flex;animation:fade .25s}
.sos-ring{width:172px;height:172px;border-radius:50%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,.18)}
.sos-ring::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent;border-top-color:#ff5566;border-right-color:#ff5566;animation:rot 1s linear infinite}
.sos-ring b{font-size:56px;font-weight:800;line-height:1;color:#fff}
.sos-ring small{color:#ffb3bc;font-size:11px;letter-spacing:2px;margin-top:8px}
.sos-cancel{margin-top:36px;padding:13px 40px;border-radius:99px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font-size:14px;cursor:pointer;letter-spacing:1px}
.sos-panel{width:100%;max-width:320px;background:linear-gradient(170deg,#1a0a10,#0d0509);border:1px solid rgba(255,45,63,.5);border-radius:24px;padding:24px 20px;box-shadow:0 0 60px rgba(255,45,63,.28);display:none;flex-direction:column;align-items:center}
.sos-panel.show{display:flex}
.sos-panel h3{color:#ff5566;font-size:18px;letter-spacing:3px;margin-bottom:16px}
.sos-step{width:100%;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:11px;background:rgba(255,45,63,.08);margin-bottom:8px;font-size:12px;color:#ffb3bc;text-align:left}
.sos-step.done{background:rgba(37,229,205,.09);color:#d8f4ef}
.sos-step i{width:16px;height:16px;border-radius:50%;border:1px solid currentColor;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-style:normal}
.sos-step.done i{background:var(--cyan);border-color:var(--cyan);color:#032a26}
.sos-step.rec i{border-color:#ff5566;background:rgba(255,45,63,.25);animation:blink 1s infinite}
.sos-close{margin-top:12px;padding:11px 36px;border-radius:99px;border:none;background:var(--red);color:#fff;font-size:13.5px;cursor:pointer;letter-spacing:2px}

/* Toast */
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,16px);z-index:90;background:rgba(16,25,35,.97);border:1px solid rgba(255,255,255,.12);color:var(--txt);padding:10px 18px;border-radius:99px;font-size:12.5px;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;max-width:330px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 12px 30px rgba(0,0,0,.55)}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer{padding:36px 5vw 54px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
footer b{color:var(--muted);letter-spacing:3px}

@media (max-width:940px){.showcase-inner{gap:30px}.guide{width:330px}}
@media (max-width:900px){.phone-holder{transform:scale(.86);transform-origin:top center;margin-bottom:-120px}}
@media (max-width:560px){.phone-holder{transform:scale(.74);margin-bottom:-230px}.guide{width:100%}.topbar .pill{display:none}}

html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
*{touch-action:manipulation}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
.viewport{position:relative;width:402px;height:874px;flex:0 0 auto;overflow:hidden;background:var(--ink);transform:scale(var(--s,1));transform-origin:center center}
.screen{border-radius:0!important}
</style>

<script>

/* ================= 基础 ================= */
const $ = id => document.getElementById(id);
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2100);
}

/* ================= 页面切换 ================= */
const pageIds = ['home','cam','music','shop','me'];
function syncNav(id){
  document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('on', b.dataset.go===id));
}
function go(id){
  pageIds.forEach(p=>{
    const el = $('p-'+p);
    if(el) el.classList.toggle('active', p===id);
  });
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.p===(id==='cam'?'home':id)));
  syncNav(id);
  $('subpage').classList.remove('open');
  closeSheet();
  if(id==='cam') startVF(); else stopVF();
}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));

/* ================= 实时定位导航 ================= */
let ngMap = null, ngMarker = null, ngRadar = null, ngSweep = null, ngWatch = null, navOn = false, curHeading = 0, wgsStart = null;
const DARK_TILE = 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}';
function wgs84ToGcj02(lat, lng){
  const outOfChina = (lat, lng) => !(lng > 73.66 && lng < 135.05 && lat > 3.86 && lat < 53.55);
  if(outOfChina(lat, lng)) return [lat, lng];
  const a = 6378245.0, ee = 0.00669342162296594323;
  function transLat(x, y){
    let r = -100 + 2*x + 3*y + .2*y*y + .1*x*y + .2*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
    r += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI)) * 2/3;
    r += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30)) * 2/3;
    return r;
  }
  function transLng(x, y){
    let r = 300 + x + 2*y + .1*x*x + .1*x*y + .1*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
    r += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI)) * 2/3;
    r += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI)) * 2/3;
    return r;
  }
  let dLat = transLat(lng-105, lat-35), dLng = transLng(lng-105, lat-35);
  const radLat = lat/180*Math.PI;
  let magic = Math.sin(radLat); magic = 1 - ee*magic*magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat*180) / ((a*(1-ee)) / (magic*sqrtMagic) * Math.PI);
  dLng = (dLng*180) / (a/sqrtMagic * Math.cos(radLat) * Math.PI);
  return [lat + dLat, lng + dLng];
}
function navStatus(txt, on){
  $('nav-status').textContent = txt;
  $('nav-btn').classList.toggle('active', !!on);
}
function startNav(silent){
  if(navOn){ if(!silent) stopNav(); return; }
  if(typeof L === 'undefined'){ if(!silent) toast('地图库未加载，请检查网络后重试'); return; }
  if(!navigator.geolocation){ if(!silent) toast('当前设备不支持定位'); return; }
  navStatus('正在获取定位…', true);
  navigator.geolocation.getCurrentPosition(
    p => {
      wgsStart = [p.coords.latitude, p.coords.longitude];
      const c0 = wgs84ToGcj02(p.coords.latitude, p.coords.longitude);
      initNgMap(c0[0], c0[1]);
      navStatus('导航中 · 跟随实时位置', true);
      ngWatch = navigator.geolocation.watchPosition(
        pos => { const c = wgs84ToGcj02(pos.coords.latitude, pos.coords.longitude); updateNgPos(c[0], c[1], pos.coords.accuracy); },
        () => {},
        {enableHighAccuracy:true, maximumAge:2000, timeout:15000}
      );
      enableCompass();
    },
    err => {
      navOn = false;
      navStatus('定位失败 · 点击重试', false);
      if(!silent) toast(err.code===1 ? '定位权限被拒绝，请在浏览器设置中允许' : '定位失败，请到户外或检查网络');
    },
    {enableHighAccuracy:true, timeout:15000}
  );
  navOn = true;
}
function initNgMap(lat, lng){
  if(!ngMap){
    ngMap = L.map('realmap', {zoomControl:false, attributionControl:false}).setView([lat,lng], 18);
    L.tileLayer(DARK_TILE, {subdomains:'1234', maxZoom:19}).addTo(ngMap);
    const icon = L.divIcon({
      className:'ng-me-wrap', iconSize:[40,40], iconAnchor:[20,20],
      html:'<div class="ng-me-arrow" id="ng-arrow"><svg viewBox="0 0 40 40"><path d="M20 2 L33 34 L20 27 L7 34 Z" fill="#25e5cd" stroke="#eafffb" stroke-width="2.2" stroke-linejoin="round"/></svg></div>'
    });
    ngMarker = L.marker([lat,lng], {icon:icon}).addTo(ngMap);
    // 50 米半径雷达圈（地理真实半径）
    ngRadar = L.circle([lat,lng], {
      radius:50, color:'#25e5cd', weight:1.2, opacity:.55,
      fillColor:'#25e5cd', fillOpacity:.07, interactive:false
    }).addTo(ngMap);
    // 扫描扇形（用 divIcon 按当前缩放计算像素半径，随位置移动）
    updateSweep(lat, lng);
    $('realmap').classList.add('ready');
    $('decor-radar').style.display = 'none';
    $('map-legend').style.display = 'none';
  } else {
    ngMap.setView([lat,lng], 18);
    ngMarker.setLatLng([lat,lng]);
    ngRadar.setLatLng([lat,lng]);
    updateSweep(lat, lng);
  }
}
function updateSweep(lat, lng){
  if(!ngMap) return;
  const metersPerPx = 156543.03392 * Math.cos(lat*Math.PI/180) / Math.pow(2, ngMap.getZoom());
  const d = Math.round(100 / metersPerPx);
  const sweepIcon = L.divIcon({
    className:'ng-me-wrap', iconSize:[d,d], iconAnchor:[d/2,d/2],
    html:'<div class="ng-radar-sweep" style="width:'+d+'px;height:'+d+'px"></div>'
  });
  if(!ngSweep){ ngSweep = L.marker([lat,lng], {icon:sweepIcon, interactive:false}).addTo(ngMap); }
  else { ngSweep.setLatLng([lat,lng]); ngSweep.setIcon(sweepIcon); }
}
function updateNgPos(lat, lng, acc){
  if(!ngMap) return;
  ngMap.setView([lat,lng], ngMap.getZoom(), {animate:true, duration:.6});
  ngMarker.setLatLng([lat,lng]);
  ngRadar.setLatLng([lat,lng]);
  updateSweep(lat, lng);
  navStatus('导航中 · 精度 ±'+Math.round(acc)+'m', true);
}
function onOrient(e){
  let h = null;
  if(typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
  else if(e.alpha != null) h = (360 - e.alpha) % 360;
  if(h == null) return;
  curHeading = h;
  const rm = $('realmap');
  if(rm) rm.style.transform = 'rotate(' + (-h) + 'deg)';
  const arrow = $('ng-arrow');
  if(arrow) arrow.style.transform = 'rotate(' + h + 'deg)';
  const decorArrow = $('decor-arrow');
  if(decorArrow) decorArrow.style.transform = 'rotate(' + h + 'deg)';
}

// 搜索地点（Photon，返回附近地点+详细地址）
async function searchPlaces(q){
  const panel = $('place-panel');
  panel.innerHTML = '<div class="route-loading"><div class="spin"></div>正在搜索附近地点…</div>';
  panel.classList.add('open');
  try{
    let url = PHOTON + '?q=' + encodeURIComponent(q) + '&limit=12';
    // 有定位时优先搜附近
    if(ngMarker){ const c = ngMarker.getLatLng(); url += '&lat=' + c.lat + '&lon=' + c.lng; }
    const res = await fetch(url);
    const data = await res.json();
    placeResults = (data.features||[]).map(f=>{
      const p = f.properties||{};
      const addr = [p.state,p.city,p.district,p.street,p.housenumber].filter(Boolean).join('');
      return {
        name: p.name || p.street || '未命名地点',
        address: addr || '暂无详细地址',
        lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0]
      };
    });
    if(!placeResults.length){
      panel.innerHTML = '<div class="place-empty">没有找到相关地点<br>试试更简短的地名，如"武汉大学"</div>';
      return;
    }
    panel.innerHTML = '<div class="pp-head">附近地点 · 共 '+placeResults.length+' 个结果</div>' + placeResults.map((pl,i)=>`
      <div class="place-item" onclick="choosePlace(${i})">
        <span class="pi-ico"><svg viewBox="0 0 24 24"><use href="#i-location"/></svg></span>
        <span class="pi-body"><b>${pl.name}</b><small>${pl.address}</small></span>
      </div>`).join('');
  }catch(e){
    panel.innerHTML = '<div class="place-empty">搜索失败，请检查网络后重试</div>';
  }
}

// 选地点 → 规划真实路线
async function choosePlace(i){
  const pl = placeResults[i];
  destPoint = pl;
  $('dest-input').value = pl.name;
  $('place-panel').classList.remove('open');
  closeRoutePanel();
  const panel = $('route-panel');
  $('rp-dest').textContent = '从当前位置 → ' + pl.name;
  $('route-list').innerHTML = '<div class="route-loading"><div class="spin"></div>正在规划夜行路线…</div>';
  panel.classList.add('open');

  const start = wgsStart || (ngMarker ? [ngMarker.getLatLng().lat, ngMarker.getLatLng().lng] : null);
  if(!start){ toast('请先开启定位以获取起点'); $('route-list').innerHTML='<div class="place-empty">请先开启实时定位</div>'; return; }
  try{
    const url = OSRM + 'driving/' + start[1] + ',' + start[0] + ';' + pl.lng + ',' + pl.lat +
      '?overview=full&geometries=geojson&alternatives=true&steps=false';
    const res = await fetch(url);
    const data = await res.json();
    if(data.code !== 'Ok' || !data.routes || !data.routes.length) throw new Error('no route');
    const routes = data.routes.slice(0,3).map((r,idx)=>assessRoute(r, idx));
    // 最快 = 时长最短；最安全 = 安全分最高（确保两个标签不同）
    const byTime = routes.slice().sort((a,b)=>a.seconds-b.seconds);
    const bySafe = routes.slice().sort((a,b)=>b.safety-a.safety);
    byTime[0].label = '最快路线'; byTime[0].tag = 'fast';
    const safePick = bySafe[0]===byTime[0] ? (bySafe[1]||bySafe[0]) : bySafe[0];
    safePick.label = '优先安全路线'; safePick.tag = 'safe';
    curRoutes = [byTime[0], safePick].filter((v,i,a)=>a.findIndex(x=>x.route===v.route)===i);
    selRoute = -1;
    curRoutes.forEach(r=>r.coords = routes.find(x=>x.route===r.route).coords || r.coords);
    renderRoutes();
    drawRealRoutes();
  }catch(e){
    $('route-list').innerHTML = '<div class="place-empty">路线规划失败<br>请检查网络或目的地是否可达</div>';
  }
}
// 安全评估：基于真实路线的距离、曲折度、时长，推演路灯/监控/人流/暗区
function assessRoute(r, idx){
  const distKm = r.distance/1000;
  const sec = r.duration;
  const coords = r.geometry && r.geometry.coordinates ? r.geometry.coordinates.map(c=>[c[1],c[0]]) : [];
  let turns = 0;
  for(let i=2;i<coords.length;i++){
    const a=coords[i-2],b=coords[i-1],c=coords[i];
    const v1=[b[0]-a[0],b[1]-a[1]],v2=[c[0]-b[0],c[1]-b[1]];
    const cross=Math.abs(v1[0]*v2[1]-v1[1]*v2[0]);
    if(cross>0.00002) turns++;
  }
  const straight = Math.max(distKm,0.1) > 0 ? turns/Math.max(distKm,0.1) : 0;
  // 主干道（转弯少、均匀）安全性评估更高；迂回小路风险偏高
  const safety = Math.max(30, Math.min(96, Math.round(88 - straight*6 - (idx===0?4:0) + (distKm>3?3:0))));
  const lamp = Math.max(3, Math.round(safety/7 + (idx===1?2:0)));
  const cam = Math.max(1, Math.round(safety/12));
  const dark = Math.max(0, Math.round((100-safety)/14));
  return {
    route: r, coords: coords, distance: r.distance, seconds: sec, safety: safety,
    time: Math.ceil(sec/60), dist: distKm.toFixed(1),
    grade: safety>=75?'high':'mid', gradeText: safety>=75?'安全等级高':'照明偏弱',
    lamp: lamp, cam: cam, crowd: safety>=75?'较多':'较少', dark: dark,
    note: safety>=75
      ? '主干道为主，路灯与监控覆盖较完整，照明缺失区域少，安全性更高。'
      : '耗时较短，但途经部分小路段照明偏弱、监控较少，风险相对偏高，建议开启夜视相机。',
    noteCls: safety>=75 ? 'good' : 'warn'
  };
}
function renderRoutes(){
  $('route-list').innerHTML = curRoutes.map((r,i)=>`
    <div class="route-card ${selRoute===i?'sel':''}" onclick="selectRoute(${i})">
      <div class="rc-top">
        <span class="route-tag ${r.tag}">${r.label}</span>
        <span class="route-grade ${r.grade}">${r.gradeText} · ${r.safety}分</span>
      </div>
      <div class="rc-main">
        <span class="rc-time">${r.time}<small>分钟</small></span>
        <span class="rc-dist">约 ${r.dist} km</span>
      </div>
      <div class="rc-stats">
        <span><i class="lg-lamp"></i>路灯 ${r.lamp}</span>
        <span><i class="lg-cam"></i>监控 ${r.cam}</span>
        <span><i class="lg-safe"></i>人流${r.crowd}</span>
        <span><i class="lg-risk"></i>暗区 ${r.dark}</span>
      </div>
      <div class="rc-note ${r.noteCls}">${r.note}</div>
      <span class="route-go">${selRoute===i?'已选中 · 开始导航':'选择此路线导航 →'}</span>
    </div>`).join('');
}
function selectRoute(i){
  selRoute = i;
  renderRoutes();
  highlightRoute();
  const r = curRoutes[i];
  toast('已选择「'+r.label+'」· 预计 '+r.time+' 分钟，开始导航');

function clearRoute(){
  $('dest-input').value = '';
  $('place-panel').classList.remove('open');
  closeRoutePanel();
  if(window.routeLayers){ window.routeLayers.forEach(l=>{ if(ngMap) ngMap.removeLayer(l); }); window.routeLayers=[]; }
  toast('已退出路线规划');
}
function closeRoutePanel(){ $('route-panel').classList.remove('open'); }
function drawRealRoutes(){
  if(!ngMap || !curRoutes.length) return;
  if(window.routeLayers){ window.routeLayers.forEach(l=>ngMap.removeLayer(l)); }
  window.routeLayers = [];
  const all = [];
  curRoutes.forEach((r,i)=>{
    if(!r.coords || r.coords.length<2) return;
    const color = r.tag==='safe' ? '#25e5cd' : '#ff8a1f';
    const gcj = r.coords.map(p=>wgs84ToGcj02(p[0],p[1]));
    const layer = L.polyline(gcj, {color:color, weight:5, opacity:.85}).addTo(ngMap);
    layer._gcj = gcj;
    window.routeLayers.push(layer);
    all.push(...gcj);
  });
  // 目的地标记
  if(destPoint){ const dp = wgs84ToGcj02(destPoint.lat,destPoint.lng); window.routeLayers.push(L.marker(dp).addTo(ngMap)); }
  if(all.length) ngMap.fitBounds(L.latLngBounds(all).pad(.2));
  highlightRoute();
}
function highlightRoute(){
  if(!window.routeLayers || !curRoutes.length) return;
  window.routeLayers.forEach((l,i)=>{
    if(l.setStyle && i<curRoutes.length){
      const isSel = selRoute===i;
      l.setStyle({weight:isSel?7:3, opacity:isSel?1:.35});
    }
  });
}

const SW = 201, SH = 437;

const nz = new Uint8Array(65536);
for(let i=0;i<nz.length;i++) nz[i] = Math.random()*255;

const lutNV = new Uint8ClampedArray(768), lutIR = new Uint8ClampedArray(768);
const ironStops = [[0,[0,0,0]],[.18,[38,0,72]],[.34,[96,0,120]],[.5,[168,20,86]],[.64,[226,56,42]],[.8,[255,146,28]],[.92,[255,224,96]],[1,[255,255,232]]];
function iron(v){
  for(let i=1;i<ironStops.length;i++){
    if(v<=ironStops[i][0]){
      const [a,ca]=ironStops[i-1], [b,cb]=ironStops[i];
      const t=(v-a)/(b-a);
      return [ca[0]+(cb[0]-ca[0])*t, ca[1]+(cb[1]-ca[1])*t, ca[2]+(cb[2]-ca[2])*t];
    }
  }
  return ironStops[ironStops.length-1][1];
}
for(let i=0;i<256;i++){
  const v=i/255;
  const b=Math.pow(v,.64)*1.16;
  lutNV[i*3]=Math.min(255,b*78); lutNV[i*3+1]=Math.min(255,b*288); lutNV[i*3+2]=Math.min(255,b*136);
  const c=iron(v);
  lutIR[i*3]=c[0]; lutIR[i*3+1]=c[1]; lutIR[i*3+2]=c[2];
}

function ac(){
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();

  return AC;
}
function clearAudio(){
  live.forEach(n=>{ try{ n.stop ? n.stop() : n.disconnect(); }catch(e){} });
  live = [];

  clearInterval(callTimer); callTimer = null;

function noiseVoice(freq){
  const a = ac();
  const buf = a.createBuffer(1, a.sampleRate*2, a.sampleRate);
  const ch = buf.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i] = Math.random()*2-1;
  const src = a.createBufferSource(); src.buffer = buf; src.loop = true;
  const flt = a.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = freq; flt.Q.value = .6;
  const gn = a.createGain(); gn.gain.value = 0;
  gn.gain.linearRampToValueAtTime(.16, a.currentTime+1.2);
  src.connect(flt).connect(gn).connect(a.destination);
  src.start(); live.push(src, gn);
}
function melodyVoice(scale){
  const a = ac();
  const notes = scale ? [261.6,293.7,329.6,392,440,523.3,587.3] : [196,220,246.9,293.7,329.6,392];
  melodyTimer = setInterval(()=>{
    const f = notes[Math.floor(Math.random()*notes.length)];
    const o1 = a.createOscillator(), o2 = a.createOscillator();
    o1.type = 'sine'; o2.type = 'triangle';
    o1.frequency.value = f; o2.frequency.value = f*2.004;
    const gn = a.createGain();
    gn.gain.setValueAtTime(0, a.currentTime);
    gn.gain.linearRampToValueAtTime(.075, a.currentTime+.18);
    gn.gain.exponentialRampToValueAtTime(.001, a.currentTime+1.35);
    o1.connect(gn); o2.connect(gn); gn.connect(a.destination);
    o1.start(); o2.start(); o1.stop(a.currentTime+1.4); o2.stop(a.currentTime+1.4);
  }, 640);
}
function startVoice(){
  clearAudio();
  const t = tracks[cur];
  if(t.type==='noise' || t.type==='rain') noiseVoice(t.type==='rain'?1500:800);
  else if(t.type==='forest') noiseVoice(2600);
  else melodyVoice(t.name.indexOf('晚风')<0);
}
function paintMusic(){
  const t = tracks[cur];
  $('m-title').textContent = t.name;
  $('m-sub').textContent = t.sub;
  $('t-dur').textContent = fmt(t.dur);

  $('t-cur').textContent = fmt(prog);

  $('vinyl').classList.toggle('playing', playing);

  const tag = $('playing-tag');

  tag.classList.toggle('on', playing);
}
function togglePlay(){
  playing = !playing;
  if(playing){
    ac(); startVoice();
    clearInterval(progTimer);
    progTimer = setInterval(()=>{
      prog++;
      if(prog >= tracks[cur].dur){
        if(loopOn) prog = 0;
        else { prog = 0; nextTrack(); return; }
      }
      paintMusic();
    },1000);
  } else {
    clearAudio(); clearInterval(progTimer);
  }
  paintMusic();
}
function pickTrack(i){
  cur = i; prog = 0;
  paintMusic();
  if(playing) startVoice();
}
function nextTrack(){ pickTrack((cur+1)%tracks.length); }
function prevTrack(){ pickTrack((cur-1+tracks.length)%tracks.length); }
function seek(e){
  const r = e.currentTarget.getBoundingClientRect();
  prog = Math.floor(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)) * tracks[cur].dur);
  paintMusic();
}
function toggleLoop(){

}
function filterTracks(){
  const q = $('m-search').value.trim();
  if(!q) return;
  const hit = tracks.findIndex(t=>t.name.indexOf(q)>=0 || t.sub.indexOf(q)>=0);
  if(hit>=0) pickTrack(hit);
}

let cropImg = null, cropScale = 1, cropX = 0, cropY = 0, cropDrag = null;
const cropCanvas = $('crop-canvas'), cropCtx = cropCanvas.getContext('2d');
function openAvatarMenu(){ closeSheet(); setTimeout(()=>openSheet('avatar'), 220); }
function pickAvatar(src){
  closeSheet();
  const input = src==='camera' ? $('file-camera') : $('file-album');
  input.value = '';

function onAvatarFile(e){
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast('请选择图片文件'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => { startCrop(img); };
    img.onerror = () => toast('图片读取失败，请重试');
    img.src = ev.target.result;
  };
  reader.readAsDataURL(f);
}
function startCrop(img){
  cropImg = img;
  const stage = $('crop-stage');
  const w = stage.clientWidth || 380, h = stage.clientHeight || 620;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cropCanvas.width = w*dpr; cropCanvas.height = h*dpr;
  cropCtx.setTransform(dpr,0,0,dpr,0,0);
  const base = Math.max(270/img.width, 270/img.height);
  cropScale = base; cropX = 0; cropY = 0;
  const slider = $('crop-scale');
  slider.min = Math.round(base*100); slider.max = Math.round(base*100*3); slider.value = Math.round(base*100);
  $('crop-overlay').classList.add('open');
  requestAnimationFrame(drawCrop);
}
function drawCrop(){
  if(!cropImg) return;
  const W = $('crop-stage').clientWidth||380, H = $('crop-stage').clientHeight||620;
  cropCtx.clearRect(0,0,W,H);
  cropCtx.fillStyle = '#04080c'; cropCtx.fillRect(0,0,W,H);
  const dw = cropImg.width*cropScale, dh = cropImg.height*cropScale;
  cropCtx.drawImage(cropImg, W/2 - dw/2 + cropX, H/2 - dh/2 + cropY, dw, dh);
}
function onCropMove(e){
  if(!cropDrag) return;
  const p = e.touches ? e.touches[0] : e;
  cropX = p.clientX - cropDrag.x0 + cropDrag.cx0;
  cropY = p.clientY - cropDrag.y0 + cropDrag.cy0;
  drawCrop();
  e.preventDefault();
}
function initCropDrag(){
  const stage = $('crop-stage');
  stage.addEventListener('pointerdown', e=>{
    cropDrag = {x0:e.clientX, y0:e.clientY, cx0:cropX, cy0:cropY};
    stage.setPointerCapture && stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', onCropMove);
  stage.addEventListener('pointerup', ()=>cropDrag=null);
  stage.addEventListener('pointercancel', ()=>cropDrag=null);
  $('crop-scale').addEventListener('input', e=>{
    cropScale = parseInt(e.target.value,10)/100;
    drawCrop();
  });
}
function closeCrop(){
  $('crop-overlay').classList.remove('open');
  cropImg = null;
}
function applyCrop(){
  if(!cropImg){ toast('请先选择图片'); return; }
  const S = 300, out = document.createElement('canvas');
  out.width = S; out.height = S;
  const ctx = out.getContext('2d');
  const stageW = $('crop-stage').clientWidth||380, stageH = $('crop-stage').clientHeight||620;
  const dw = cropImg.width*cropScale, dh = cropImg.height*cropScale;
  const dx = stageW/2 - dw/2 + cropX, dy = stageH/2 - dh/2 + cropY;
  const ratio = S/270;
  ctx.save();
  ctx.beginPath(); ctx.arc(S/2,S/2,S/2,0,Math.PI*2); ctx.clip();
  ctx.drawImage(cropImg, (dx - (stageW-270)/2)*ratio, (dy - (stageH-270)/2)*ratio, dw*ratio, dh*ratio);
  ctx.restore();
  const data = out.toDataURL('image/png');
  $('avatar-img').src = data;
  $('avatar-box').classList.add('has-img');
  account.avatar = data;
  try { localStorage.setItem('ng_avatar', data); } catch(e){}
  closeCrop();
  toast('头像已更新');
}

function sendCode(){
  const p = ($('acct-phone').value||'').trim();
  if(!/^1\d{10}$/.test(p)){ toast('请输入正确的 11 位手机号'); return; }
  account.phone = p;
  account.code = String(Math.floor(1000+Math.random()*9000));
  toast('验证码已发送（演示）：'+account.code);
}
function doLogin(){
  const p = ($('acct-phone').value||'').trim();
  const c = ($('acct-code').value||'').trim();
  if(!/^1\d{10}$/.test(p)){ toast('请输入正确的 11 位手机号'); return; }
  if(!/^\d{4}$/.test(c)){ toast('请输入 4 位验证码'); return; }
  if(c!==account.code){ toast('验证码不正确，请重新输入'); return; }
  account.loggedIn = true;
  account.phone = p;
  renderAccount(); closeSheet(); toast('登录成功 · 欢迎回来');
}
function saveNickname(){
  const v = ($('acct-newname').value||'').trim();
  if(!v){ toast('昵称不能为空'); return; }
  if(v.length>12){ toast('昵称最多 12 个字'); return; }
  account.nickname = v;
  renderAccount(); closeSheet(); toast('昵称已修改');
}
function logoutAccount(){
  account.loggedIn = false; account.phone = ''; account.code = '';
  renderAccount(); closeSheet(); toast('已退出登录');
}

function renderChips(){
  $('chips').innerHTML = cats.map(c=>`<span class="chip ${c===activeCat?'on':''}" onclick="setCat('${c}')">${c}</span>`).join('');
}
function setCat(c){ activeCat = c; renderChips(); renderShop(); }
function renderShop(){
  const q = ($('shop-search').value || '').trim();
  const list = products.filter(p=>
    (activeCat==='全部' || p.cat===activeCat) &&
    (!q || p.name.indexOf(q)>=0 || p.desc.indexOf(q)>=0)
  );
  $('shop-grid').innerHTML = list.length ? list.map(p=>{
    const i = products.indexOf(p);
    return `<div class="prod" onclick="openProduct(${i})">
      <div class="p-img">${p.svg}${p.hot?'<span class="p-tag">热销</span>':''}</div>
      <div class="p-body">
        <div class="p-name">${p.name}</div>
        <div class="p-desc">${p.desc}</div>
        <div class="p-foot">
          <span class="price"><small>¥</small>${p.price}</span>
          <button class="add-btn ${i%3===2?'orange':''}" onclick="event.stopPropagation();addCart(${i})">加购</button>
        </div>
      </div>
    </div>`;
  }).join('') : `<div style="grid-column:1/3;text-align:center;color:#6d8094;font-size:12.5px;padding:40px 0">没有找到相关装备</div>`;
}
function addCart(i){
  const hit = cart.find(c=>c.i===i);
  if(hit) hit.n++; else cart.push({i:i,n:1});
  const total = cart.reduce((s,c)=>s+c.n,0);
  const b = $('shop-badge');
  b.textContent = total; b.classList.add('show');
  toast('已加入购物车：' + products[i].name);
}

/* ================= 弹层 ================= */
function openSheet(type, idx){
  const mask = $('mask'), sh = $('sheet');
  let title = '播放列表', html = '';
  if(type==='playlist'){
    html = tracks.map((t,i)=>`<div class="s-item" onclick="pickTrack(${i});closeSheet()">
      <div class="si-ico">${t.emoji}</div>
      <div><b>${t.name}</b><small>${t.sub}</small></div>
      <span class="si-r">${i===cur?'播放中':fmt(t.dur)}</span></div>`).join('');
  } else if(type==='cart'){
    title = '购物车';
    if(!cart.length){
      html = `<div style="text-align:center;color:#6d8094;font-size:12.5px;padding:34px 0">购物车还是空的<br>去挑选一件夜行装备吧</div>`;
    } else {
      html = cart.map(c=>`<div class="s-item">
        <div class="si-ico">🛡️</div>
        <div><b>${products[c.i].name}</b><small>¥${products[c.i].price} × ${c.n}</small></div>
        <button class="si-del" onclick="delCart(${c.i})">移除</button></div>`).join('')
        + `<div style="display:flex;justify-content:space-between;padding:16px 2px 4px;font-size:13px"><span style="color:#8ba0b2">合计</span><b style="color:#25e5cd;font-size:17px">¥${cart.reduce((s,c)=>s+products[c.i].price*c.n,0)}</b></div>`;
    }
  } else if(type==='product'){
    const p = products[idx];
    title = '商品详情';
    html = `<div style="height:170px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,#1c2733,#0a1017);border-radius:18px;margin-bottom:14px">${p.svg}</div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:6px">
        <b style="font-size:17px">${p.name}</b><b style="color:#ffd166;font-size:19px">¥${p.price}</b>
      </div>
      <p style="color:#8ba0b2;font-size:12.5px;line-height:1.8;margin-bottom:16px">${p.desc}。夜行场景专用设计，轻量便携、单手可操作，出发前放进包里即可获得一份额外守护。</p>
      <button class="add-line" style="border-style:solid;border-color:#25e5cd;color:#032a26;background:linear-gradient(135deg,#4df3dc,#00bfa8);font-weight:700" onclick="addCart(${idx});closeSheet()">加入购物车</button>`;
  } else if(type==='avatar'){
    title = '更换头像';
    html = `<button class="avatar-menu-btn" onclick="pickAvatar('camera')">
        <span class="am-ico"><svg viewBox="0 0 24 24"><use href="#i-cam"/></svg></span>
        <span><b>拍照</b><small>调用手机相机拍摄照片</small></span>
      </button>
      <button class="avatar-menu-btn" onclick="pickAvatar('album')">
        <span class="am-ico"><svg viewBox="0 0 24 24"><use href="#i-image"/></svg></span>
        <span><b>从相册选择</b><small>从手机相册中挑选图片</small></span>
      </button>
      <div class="acct-tip">选择后可在圆形框中拖动、缩放，确认后套用为头像</div>`;
  } else if(type==='account'){
    if(account.loggedIn){
      title = '修改昵称';
      html = `<div class="acct-field"><label>当前昵称</label><input class="inp" value="${account.nickname}" readonly></div>
        <div class="acct-field"><label>新昵称</label><input class="inp" id="acct-newname" maxlength="12" placeholder="输入新的昵称（最多 12 字）"></div>
        <button class="acct-primary" onclick="saveNickname()">保存昵称</button>
        <button class="acct-ghost" onclick="logoutAccount()">退出登录</button>
        <div class="acct-tip">登录手机号：${account.phone.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2')}</div>`;
    } else {
      title = '手机号登录';
      html = `<div class="acct-field"><label>手机号</label><input class="inp" id="acct-phone" type="tel" maxlength="11" placeholder="请输入 11 位手机号"></div>
        <div class="acct-field"><label>验证码</label><div class="acct-row"><input class="inp" id="acct-code" type="tel" maxlength="4" placeholder="4 位验证码"><button class="code-btn" onclick="sendCode()">获取验证码</button></div></div>
        <button class="acct-primary" onclick="doLogin()">登录</button>
        <div class="acct-tip">演示版：点击「获取验证码」后，验证码会显示在提示中<br>登录后可修改昵称、同步夜行数据</div>`;
    }
  }
  $('sheet-title').textContent = title;
  $('sheet-body').innerHTML = html;
  mask.classList.add('show'); sh.classList.add('open');
}
function delCart(i){
  cart = cart.filter(c=>c.i!==i);
  const total = cart.reduce((s,c)=>s+c.n,0);
  const b = $('shop-badge');
  b.textContent = total; b.classList.toggle('show', total>0);
  openSheet('cart');
}
function closeSheet(){
  $('mask').classList.remove('show');
  $('sheet').classList.remove('open');
}
function openProduct(i){ openSheet('product', i); }

// iOS 方向权限需用户手势：首次触摸屏幕时自动请求，之后箭头随转向
(function autoCompass(){
  const DOE = window.DeviceOrientationEvent;
  if(!DOE) return;
  if(typeof DOE.requestPermission !== 'function'){
    window.addEventListener('deviceorientation', onOrient);
    return;
  }
  const ask = () => {
    DOE.requestPermission().then(r => { if(r==='granted') window.addEventListener('deviceorientation', onOrient); }).catch(()=>{});
    document.removeEventListener('touchstart', ask);
    document.removeEventListener('click', ask);
  };
  document.addEventListener('touchstart', ask, {once:false, passive:true});
  document.addEventListener('click', ask);
})();

(function(){
  function fit(){
    var s = Math.min(window.innerWidth/402, window.innerHeight/874);
    document.documentElement.style.setProperty('--s', s);
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 120); });
})();
</script>
